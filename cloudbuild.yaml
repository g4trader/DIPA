# Configuração para Google Cloud Build (CI/CD)
# Use este arquivo para deploy automatizado via Cloud Build

steps:
  # Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/dipam-ai-backend:${SHORT_SHA}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/dipam-ai-backend:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Push da imagem para Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/dipam-ai-backend:${SHORT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/dipam-ai-backend:latest'

  # Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dipam-ai-backend'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/dipam-ai-backend:${SHORT_SHA}'
      - '--region'
      - 'us-central1'  # Ajuste para sua região preferida
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'  # Remove se precisar de autenticação
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'  # Ajuste conforme necessidade
      - '--cpu'
      - '1'
      - '--timeout'
      - '300s'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--set-env-vars'
      - 'PORT=8080,DB_TYPE=postgresql'
      - '--set-secrets'
      - 'POSTGRES_USER=postgres-user:latest,POSTGRES_PASSWORD=postgres-password:latest,POSTGRES_DB=postgres-db:latest,OPENAI_API_KEY=openai-api-key:latest'
      # Se usar Cloud SQL via socket:
      # - '--add-cloudsql-instances'
      # - '${PROJECT_ID}:${REGION}:${INSTANCE_NAME}'

# Imagens a serem construídas
images:
  - 'gcr.io/${PROJECT_ID}/dipam-ai-backend:${SHORT_SHA}'
  - 'gcr.io/${PROJECT_ID}/dipam-ai-backend:latest'

# Timeout do build (5 minutos)
timeout: '600s'

# Opções
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

