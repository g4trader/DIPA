[pytest]
# Configuração do pytest para o projeto Dipam AI

# Diretórios a procurar por testes
testpaths = tests

# Padrões de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Adiciona diretório raiz ao path
pythonpath = .

# Mostra output mesmo em testes que passam
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    --durations=10

# Marcadores customizados
markers =
    unit: Testes unitários
    integration: Testes de integração
    slow: Testes lentos que podem ser pulados
    api: Testes da API
    ml: Testes de modelos de ML
    ingestion: Testes de ingestão de dados

# Configuração de cobertura (se pytest-cov estiver instalado)
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False




